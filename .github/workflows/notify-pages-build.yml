name: Notify Feishu on Pages Build

on:
  page_build:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          STATUS: ${{ github.event.build.status }}
          COMMIT: ${{ github.event.build.commit }}
          ERROR_MSG: ${{ github.event.build.error.message }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$STATUS" = "errored" ]; then
            TITLE="❌ GitHub Pages 构建失败"
          else
            TITLE="✅ GitHub Pages 构建成功"
          fi

          BODY=$(printf '仓库：%s\ncommit：%s' "$REPO" "$COMMIT")
          if [ "$STATUS" = "errored" ] && [ -n "$ERROR_MSG" ]; then
            BODY=$(printf '%s\n错误：%s' "$BODY" "$ERROR_MSG")
          fi

          TEXT=$(printf '%s\n%s' "$TITLE" "$BODY")
          PAYLOAD=$(jq -n --arg text "$TEXT" '{msg_type: "text", content: {text: $text}}')

          curl -sS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
